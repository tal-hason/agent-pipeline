<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Closed-loop 9-stage engineering pipeline mark with ~12.5% outer margin -->
  <defs>
    <linearGradient id="ap-ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Outer control loop ring (with directional gap for feedback arrow) -->
  <path
    d="M 64 20 A 44 44 0 1 1 25.9 42"
    stroke="url(#ap-ring)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <!-- Feedback arrowhead pointing into top node -->
  <path
    d="M 20 33 L 26 44 L 37 38"
    stroke="#38BDF8"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner pipeline flow: Scan -> Plan -> Verify/Build -->
  <path
    d="M 42 64 L 86 64"
    stroke="#818CF8"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path
    d="M 76 54 L 86 64 L 76 74"
    stroke="#34D399"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Key stage nodes -->
  <circle cx="64" cy="20" r="6" fill="#38BDF8"/>
  <circle cx="108" cy="64" r="6" fill="#34D399"/>
  <circle cx="42" cy="64" r="6" fill="#818CF8"/>
</svg>
